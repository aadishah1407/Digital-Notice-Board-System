services:
  - type: web
    name: digital-notice-board-system
    runtime: docker
    repo: https://github.com/aadishah1407/Digital-Notice-Board-System.git
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      # TiDB Cloud Starter is MySQL-protocol compatible. Set these values
      # during Blueprint setup; do not commit credentials to source control.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
