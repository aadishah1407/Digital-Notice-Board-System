services:
  - type: web
    name: digital-notice-board-system
    runtime: docker
    repo: https://github.com/aadishah1407/Digital-Notice-Board-System.git
    branch: main
    region: singapore
    plan: free
    # GitHub Actions triggers the deploy hook after successful CI checks.
    autoDeployTrigger: off
    healthCheckPath: /
    envVars:
      # Paste the MongoDB Atlas application connection string as a secret.
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
