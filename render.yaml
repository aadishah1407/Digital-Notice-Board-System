services:
  # Private MySQL 8 instance using Render's maintained example repository.
  - type: pserv
    name: dnb-mysql
    runtime: docker
    repo: https://github.com/render-examples/mysql.git
    branch: master
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: off
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: digital_notice_board
      - key: MYSQL_USER
        value: noticeboard_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # Spring Boot web service. Render deploys only after GitHub Actions checks pass.
  - type: web
    name: digital-notice-board-system
    runtime: docker
    repo: https://github.com/aadishah1407/Digital-Notice-Board-System.git
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: DB_URL
        value: jdbc:mysql://dnb-mysql:3306/digital_notice_board
      - key: DB_USERNAME
        fromService:
          type: pserv
          name: dnb-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: dnb-mysql
          envVarKey: MYSQL_PASSWORD
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
