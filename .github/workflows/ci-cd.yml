name: Digital Notice Board CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: digital-notice-board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Maven tests and Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven verification (compile + JUnit tests + package)
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build production Docker image
        run: docker build --tag digital-notice-board:${{ github.sha }} .

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-notice-board-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy validated commit to Render
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not configured. CI passed, but Render deployment was skipped."
            echo "Deployment skipped: add the RENDER_DEPLOY_HOOK_URL repository secret after creating the Render Web Service." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Render deploy-hook URLs already contain a secret key query parameter.
          # Append the exact commit SHA tested by this workflow.
          curl --silent --show-error --fail-with-body \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}"

          echo "Render accepted deployment of commit ${COMMIT_SHA}." >> "$GITHUB_STEP_SUMMARY"
