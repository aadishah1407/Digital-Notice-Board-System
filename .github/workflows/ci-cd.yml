name: Digital Notice Board CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-notice-board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test and validate Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, run JUnit tests and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build production Docker image
        run: docker build --tag digital-notice-board:${{ github.sha }} .

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-notice-board-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Publish deployment summary
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "## CI passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Maven verification, JUnit tests and Docker image build passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Render is configured to deploy this commit after GitHub checks pass (Render Blueprint: render.yaml)." >> "$GITHUB_STEP_SUMMARY"
