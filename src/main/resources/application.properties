spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digital_notice_board}
spring.datasource.username=${DB_USERNAME:noticeboard_user}
spring.datasource.password=${DB_PASSWORD:noticeboard_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
