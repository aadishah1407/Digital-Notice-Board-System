<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Notice Board</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="site-header">
        <div class="brand-mark" aria-hidden="true">NB</div>
        <p class="eyebrow">CAMPUS COMMUNICATIONS</p>
        <h1>Digital Notice Board</h1>
        <p>Choose your portal to continue.</p>
      </header>
      <section class="portal-grid" aria-label="Choose a portal">
        <a class="portal-card admin-portal" href="/admin.html">
          <span class="portal-icon" aria-hidden="true">✦</span>
          <span class="eyebrow">FACULTY & ADMIN</span>
          <strong>Admin portal</strong>
          <span class="portal-description">Create and manage campus notices.</span>
          <span class="portal-link">Continue as admin <span aria-hidden="true">→</span></span>
        </a>
        <a class="portal-card student-portal" href="/student.html">
          <span class="portal-icon" aria-hidden="true">▤</span>
          <span class="eyebrow">STUDENT ACCESS</span>
          <strong>Student portal</strong>
          <span class="portal-description">View notices for your department and academic year.</span>
          <span class="portal-link">Continue as student <span aria-hidden="true">→</span></span>
        </a>
      </section>
    </main>
  </body>
</html>
